---
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: node-factory-secret-policy
        name: Node factory secret policy
        entry: python3 scripts/check_no_secrets.py .
        language: system
        pass_filenames: false
      - id: yamllint
        name: YAML lint
        entry: yamllint .
        language: python
        additional_dependencies:
          - yamllint==1.38.0
        pass_filenames: false
        types_or: [yaml]
      - id: ansible-lint
        name: Ansible lint
        entry: ansible-lint
        language: python
        additional_dependencies:
          - ansible-core==2.20.8
          - ansible-lint==26.8.0
        pass_filenames: false
        types_or: [yaml]
